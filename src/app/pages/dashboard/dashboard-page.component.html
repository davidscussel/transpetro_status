<main class="shell"><app-dashboard-header [completedPct]="stats().completedPct" [pdfPath]="pdfPath"></app-dashboard-header>@if (loading()) {<p class="status">Carregando questões...</p>} @else if (error()) {<p class="status error">Não foi possível carregar a base de questões.</p>} @else {<app-stats-summary [stats]="stats()"></app-stats-summary><app-charts-panel [materias]="materias()" [progress]="progress()"></app-charts-panel><app-filter-bar [search]="search()" [difficulty]="difficulty()" [sort]="sort()" (searchChange)="search.set($event)" (difficultyChange)="difficulty.set($event)" (sortChange)="sort.set($event)"></app-filter-bar><div class="list-actions"><button (click)="toggleExpandAll()">{{ expandAllOpen() ? 'Recolher áreas' : 'Expandir áreas' }}</button><button class="reset" (click)="resetProgress()">Limpar progresso</button></div><app-subject-list [groups]="groups()" [flatTopics]="flatTopics()" [sort]="sort()" [progress]="progress()" [search]="search()" [expandAllOpen]="expandAllOpen()" [expandAllVersion]="expandAllVersion()" (topicDone)="markTopic($event)" (questionDone)="markQuestion($event)" (difficultyChanged)="setDifficulty($event)"></app-subject-list>}</main>
