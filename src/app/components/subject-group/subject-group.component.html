<section class="subject"><button class="subject-heading" (click)="open = !open" [attr.aria-expanded]="open"><span class="chevron">{{ open ? '−' : '+' }}</span><span><strong>{{ group.materia }}</strong><small>{{ completed }}/{{ group.assuntos.length }} assuntos concluídos</small></span><span class="subject-progress"><i [style.width.%]="group.assuntos.length ? completed * 100 / group.assuntos.length : 0"></i></span></button>@if (open) {<div>@for (topic of group.assuntos; track topic.nome) {<app-topic-item [topic]="topic" [progress]="progress" [search]="search" (topicDone)="topicDone.emit({ topic, done: $event })" (questionDone)="questionDone.emit($event)" (difficultyChanged)="difficultyChanged.emit($event)"></app-topic-item>}</div>}</section>
