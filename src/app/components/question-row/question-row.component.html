<div class="question" [class.done]="done"><input type="checkbox" [checked]="done" (change)="doneChange.emit($any($event.target).checked)" [attr.aria-label]="'Concluir questão ' + question.q"><a [href]="question.link" target="_blank" rel="noreferrer">{{ question.prova }} · Q{{ question.q }}</a><div class="difficulty" aria-label="Dificuldade"><button title="Fácil" [class.selected]="selectedDifficulty === 'facil'" (click)="difficultyChange.emit(selectedDifficulty === 'facil' ? undefined : 'facil')"></button><button title="Média" [class.selected]="selectedDifficulty === 'medio'" (click)="difficultyChange.emit(selectedDifficulty === 'medio' ? undefined : 'medio')"></button><button title="Difícil" [class.selected]="selectedDifficulty === 'dificil'" (click)="difficultyChange.emit(selectedDifficulty === 'dificil' ? undefined : 'dificil')"></button></div></div>
