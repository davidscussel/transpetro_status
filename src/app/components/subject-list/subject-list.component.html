@if (sort === 'freq') {<section class="flat-list">@for (topic of flatTopics; track topic.materiaName + topic.nome) {<div class="flat-topic"><p>{{ topic.materiaName }}</p><app-topic-item [topic]="topic" [progress]="progress" [search]="search" (topicDone)="topicDone.emit({ topic, done: $event })" (questionDone)="questionDone.emit($event)" (difficultyChanged)="difficultyChanged.emit($event)"></app-topic-item></div>} @empty {<p class="empty">Nenhum assunto encontrado com os filtros atuais.</p>}</section>} @else {@for (group of groups; track group.materia) {<app-subject-group [group]="group" [progress]="progress" [search]="search" [expandAllOpen]="expandAllOpen" [expandAllVersion]="expandAllVersion" (topicDone)="topicDone.emit($event)" (questionDone)="questionDone.emit($event)" (difficultyChanged)="difficultyChanged.emit($event)"></app-subject-group>} @empty {<p class="empty">Nenhum assunto encontrado com os filtros atuais.</p>}}
