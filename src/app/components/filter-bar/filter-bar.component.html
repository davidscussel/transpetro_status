<section class="filters"><label class="search"><span>Buscar</span><input [ngModel]="search" (ngModelChange)="searchChange.emit($event)" placeholder="Assunto, matéria ou prova"></label><div class="filter-set"><span>Dificuldade</span><button [class.active]="difficulty === 'todas'" (click)="difficultyChange.emit('todas')">Todas</button><button [class.active]="difficulty === 'facil'" (click)="difficultyChange.emit('facil')">Fácil</button><button [class.active]="difficulty === 'medio'" (click)="difficultyChange.emit('medio')">Média</button><button [class.active]="difficulty === 'dificil'" (click)="difficultyChange.emit('dificil')">Difícil</button></div><div class="filter-set"><span>Ordem</span><button [class.active]="sort === 'area'" (click)="sortChange.emit('area')">Área</button><button [class.active]="sort === 'freq'" (click)="sortChange.emit('freq')">Frequência</button></div></section>
