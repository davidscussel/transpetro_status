<section class="charts"><article><h2>Assuntos mais cobrados</h2><div class="bar-list">@for (topic of topics; track topic.materiaName + topic.nome) {<div class="bar-row"><span>{{ topic.nome }}</span><div class="bar-track"><i [style.width.%]="width(topic)"></i></div><b>{{ topic.freq }}</b></div>}</div></article><article class="donut-card"><h2>Questões resolvidas</h2><div class="donut" [style.--pct]="total ? completed * 100 / total : 0"><strong>{{ completed }}</strong><span>de {{ total }}</span></div><p>Marque as questões concluídas para atualizar o painel.</p></article></section>
<app-performance-charts [materias]="materias" [progress]="progress"></app-performance-charts>
